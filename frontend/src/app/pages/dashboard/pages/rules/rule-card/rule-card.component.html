<div class="rule-card" [class.inactive]="!rule.active">

  <div class="card-topbar">
    <div class="rule-id">
      <span class="id-prefix">RULE</span>
      <span class="id-num">{{ rule.id.toString().padStart(4, '0') }}</span>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label">{{ rule.active ? 'ON' : 'OFF' }}</span>
      <button class="toggle-btn"
              [class.on]="rule.active"
              (click)="toggled.emit(rule)"
              [title]="rule.active ? 'Désactiver' : 'Activer'">
        <span class="toggle-thumb"></span>
      </button>
    </div>
  </div>

  <div class="card-body">
    <h3 class="rule-name">{{ rule.name }}</h3>
    <p class="rule-desc" *ngIf="rule.description">{{ rule.description }}</p>

    <div class="event-row">
      <span class="event-chip">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <polygon points="5,1 9,9 1,9" fill="currentColor"/>
        </svg>
        {{ rule.triggerEvent }}
      </span>
    </div>

    <div class="actions-row">
      <div class="action-pill" *ngFor="let action of rule.actions">
        <ng-container *ngIf="action.type === 'POINTS'">
          <span class="action-icon points-icon">★</span>
          <span class="action-val">+{{ action.pointsAmount }}</span>
          <span class="action-unit">pts</span>
        </ng-container>
        <ng-container *ngIf="action.type === 'BADGE'">
          <span class="action-icon">🏅</span>
          <span class="action-val">Badge #{{ action.badgeId }}</span>
        </ng-container>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <span class="created-at">
      <svg width="10" height="10" viewBox="0 0 10 10">
        <circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1" fill="none"/>
        <path d="M5 3v2.5l1.5 1" stroke="currentColor" stroke-width="1"
              stroke-linecap="round" fill="none"/>
      </svg>
      {{ formatDate(rule.createdAt) }}
    </span>
    <div class="card-actions">
      <button class="action-btn edit-btn"
              title="Modifier"
              (click)="edited.emit(rule.id)">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M9 2l2 2-7 7H2V9L9 2z"
                stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="action-btn delete-btn"
              title="Supprimer"
              (click)="deleted.emit(rule.id)"
              [class.confirming]="confirmingId === rule.id">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 4h9M5 4V2.5h3V4M4 4l.5 7h4l.5-7"
                stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="confirm-text">Confirmer ?</span>
      </button>
    </div>
  </div>

  <div class="card-glow" *ngIf="rule.active"></div>
</div>
