<div class="kpi-grid">
  <div class="kpi-card" *ngFor="let card of cards">
    <div class="kpi-icon">{{ card.icon }}</div>
    <div class="kpi-body">
      <div class="kpi-value">{{ card.value | number }}</div>
      <div class="kpi-label">{{ card.label }}</div>
      <div class="trend" [class]="card.trendClass" *ngIf="card.trendLabel !== '—'">
        {{ card.trendLabel }}
      </div>
    </div>
  </div>
</div>
