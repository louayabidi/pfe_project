<div class="chart-wrapper">
  <ng-container *ngIf="displaySeries.length > 0; else empty">
    <div class="chart-bars">
      <div class="bar-item" *ngFor="let point of displaySeries">
        <div class="bar" [style.height.%]="(point.value / maxValue) * 100"></div>
        <span class="bar-label">{{ point.date | slice: 5 }}</span>
      </div>
    </div>
  </ng-container>
  <ng-template #empty>
    <div class="empty-state">No data available</div>
  </ng-template>
</div>
