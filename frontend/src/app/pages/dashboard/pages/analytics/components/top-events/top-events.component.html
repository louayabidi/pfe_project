<div class="list-wrapper">
  <ng-container *ngIf="items.length > 0; else empty">
    <div class="items-list">
      <div
        class="item"
        *ngFor="let item of items; let idx = index"
        [style.animation-delay]="(idx * 50) + 'ms'">
        <div class="event-info">
          <span class="event-rank">{{ idx + 1 }}</span>
          <span class="event-name">{{ item.label }}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="getPercentage(item.value)"></div>
        </div>
        <span class="event-count">{{ item.value }}</span>
      </div>
    </div>
  </ng-container>
  <ng-template #empty>
    <div class="empty-state">No events recorded</div>
  </ng-template>
</div>
