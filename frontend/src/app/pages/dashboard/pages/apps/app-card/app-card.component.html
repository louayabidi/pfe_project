<div class="app-card">

  <div class="card-top">
    <div class="card-header">
      <div class="app-icon-wrap">🎯</div>
      <div class="app-meta">
        <div class="app-name">{{ app.name }}</div>
        <div class="app-desc">{{ app.description || 'Pas de description' }}</div>
      </div>
      <div class="status-badge"
           [class.active]="app.active"
           [class.inactive]="!app.active">
        {{ app.active ? 'Active' : 'Inactive' }}
      </div>
    </div>

    <div class="api-section">
      <div class="api-label">API KEY</div>
      <div class="api-row">
        <input
          class="api-key"
          [type]="showKey() ? 'text' : 'password'"
          readonly
          [value]="app.apiKey">
       <input
  id="inpLock-{{ app.id }}"
  type="checkbox"
  class="lock-input"
  [checked]="showKey()"
  (change)="toggleKey()">
<label class="btn-lock" [for]="'inpLock-' + app.id" title="Show/hide API key">
  <svg width="20" height="22" viewBox="0 0 36 40">
    <path class="lockb" d="M27 27C27 34.1797 21.1797 40 14 40C6.8203 40 1 34.1797 1 27C1 19.8203 6.8203 14 14 14C21.1797 14 27 19.8203 27 27ZM15.6298 26.5191C16.4544 25.9845 17 25.056 17 24C17 22.3431 15.6569 21 14 21C12.3431 21 11 22.3431 11 24C11 25.056 11.5456 25.9845 12.3702 26.5191L11 32H17L15.6298 26.5191Z"/>
    <path class="lock" d="M6 21V10C6 5.58172 9.58172 2 14 2V2C18.4183 2 22 5.58172 22 10V21"/>
    <path class="bling" d="M29 20L31 22"/>
    <path class="bling" d="M31.5 15H34.5"/>
    <path class="bling" d="M29 10L31 8"/>
  </svg>
</label>
       <button
  class="copy"
  (click)="onCopy()"
  [class.copied]="isCopied"
  title="Copy API key">
  <span
    class="tooltip"
    [attr.data-text-initial]="'Copy to clipboard'"
    [attr.data-text-end]="'Copied!'">
  </span>
  <span>
    <svg class="clipboard" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 6.35 6.35">
      <g>
        <path d="M2.43.265c-.3 0-.548.236-.573.53h-.328a.74.74 0 0 0-.735.734v3.822a.74.74 0 0 0 .735.734H4.82a.74.74 0 0 0 .735-.734V1.529a.74.74 0 0 0-.735-.735h-.328a.58.58 0 0 0-.573-.53zm0 .529h1.49c.032 0 .049.017.049.049v.431c0 .032-.017.049-.049.049H2.43c-.032 0-.05-.017-.05-.049V.843c0-.032.018-.05.05-.05zm-.901.53h.328c.026.292.274.528.573.528h1.49a.58.58 0 0 0 .573-.529h.328a.2.2 0 0 1 .206.206v3.822a.2.2 0 0 1-.206.205H1.53a.2.2 0 0 1-.206-.205V1.529a.2.2 0 0 1 .206-.206z" fill="currentColor"/>
      </g>
    </svg>
    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24">
      <g>
        <path d="M9.707 19.121a.997.997 0 0 1-1.414 0l-5.646-5.647a1.5 1.5 0 0 1 0-2.121l.707-.707a1.5 1.5 0 0 1 2.121 0L9 14.171l9.525-9.525a1.5 1.5 0 0 1 2.121 0l.707.707a1.5 1.5 0 0 1 0 2.121z" fill="currentColor"/>
      </g>
    </svg>
  </span>
</button>
      </div>
      <div class="api-hint">
        dart pub global run gamif_scanner:setup .
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="created-at">
      Créée le {{ app.createdAt | date:'dd/MM/yyyy' }}
    </div>

    <div class="button-box">

      <!-- Rules -->
      <div class="button btn-rules-radial" (click)="onRules()" title="Règles">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
            stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Edit -->
      <div class="button btn-edit-radial" (click)="onEdit()" title="Modifier">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"
            stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Delete -->
      <div class="button btn-del-radial"
           (click)="!isDeleting && onDelete()"
           [class.deleting]="isDeleting"
           title="Supprimer">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6"
            stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

    </div>
  </div>

</div>

<app-edit-app-modal
  *ngIf="editing()"
  [app]="app"
  (saved)="onSaved($event)"
  (cancel)="onCancelEdit()">
</app-edit-app-modal>
