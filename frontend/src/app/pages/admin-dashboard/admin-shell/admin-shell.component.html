<div class="admin-shell" [class.theme-dark]="theme()==='dark'" [class.theme-light]="theme()==='light'">

  <!-- ══ SIDEBAR ══════════════════════════════════════════════════════════ -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed()">

    <!-- Logo -->
    <div class="sidebar-logo">
      <a routerLink="/admin/dashboard" class="logo-link">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M10 2L13.5 7H17L14 11.5L15.5 16.5L10 13.5L4.5 16.5L6 11.5L3 7H6.5L10 2Z"
                  fill="currentColor"/>
          </svg>
        </div>
        <span class="logo-text" *ngIf="!sidebarCollapsed()">
          <span class="logo-main">Gami</span><span class="logo-accent">fy</span>
          <span class="logo-badge">Admin</span>
        </span>
      </a>
      <button class="collapse-btn"
              (click)="sidebarCollapsed.set(!sidebarCollapsed())"
              [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path [attr.d]="sidebarCollapsed() ? 'M5 3l4 4-4 4' : 'M9 3L5 7l4 4'"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Role chip -->
    <div class="role-chip" *ngIf="!sidebarCollapsed()">
      <div class="role-dot" [class.super]="isSuperAdmin()"></div>
      <span>{{ isSuperAdmin() ? 'Super Admin' : 'Admin' }}</span>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">

      <span class="nav-section-label" *ngIf="!sidebarCollapsed()">Platform</span>

      <a class="nav-item"
         routerLink="/admin/dashboard/overview"
         routerLinkActive="active"
         [title]="sidebarCollapsed() ? 'Overview' : ''">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed()">Overview</span>
      </a>

      <a class="nav-item"
         routerLink="/admin/dashboard/owners"
         routerLinkActive="active"
         [title]="sidebarCollapsed() ? 'App Owners' : ''">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed()">App Owners</span>
      </a>

      <ng-container *ngIf="isSuperAdmin()">
        <span class="nav-section-label" *ngIf="!sidebarCollapsed()">Super Admin</span>
        <a class="nav-item"
           routerLink="/admin/dashboard/admins"
           routerLinkActive="active"
           [title]="sidebarCollapsed() ? 'Admin Team' : ''">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
            <path d="M10 2l1.8 3.6L16 6.2l-3 2.9.7 4.1L10 11l-3.7 2.2.7-4.1L4 6.2l4.2-.6L10 2z"
                  stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label" *ngIf="!sidebarCollapsed()">Admin Team</span>
        </a>
      </ng-container>

    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">

      <div class="sidebar-user" *ngIf="!sidebarCollapsed()">
        <div class="user-avatar">{{ adminInitial() }}</div>
        <div class="user-info">
          <div class="user-name">{{ adminName() }}</div>
          <div class="user-email">{{ adminEmail() }}</div>
        </div>
      </div>

      <button class="theme-toggle" (click)="toggleTheme()"
              [title]="theme()==='dark' ? 'Switch to light' : 'Switch to dark'">
        <!-- Sun icon -->
        <svg *ngIf="theme()==='dark'" class="nav-icon" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 2v1.5M10 16.5V18M2 10h1.5M16.5 10H18M4.4 4.4l1.1 1.1M14.5 14.5l1.1 1.1M4.4 15.6l1.1-1.1M14.5 5.5l1.1-1.1"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <!-- Moon icon -->
        <svg *ngIf="theme()==='light'" class="nav-icon" viewBox="0 0 20 20" fill="none">
          <path d="M17 11.5A7 7 0 117.5 3a5.5 5.5 0 009.5 8.5z"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed()">
          {{ theme()==='dark' ? 'Light Mode' : 'Dark Mode' }}
        </span>
      </button>

      <button class="logout-btn" (click)="logout()"
              [title]="sidebarCollapsed() ? 'Logout' : ''">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <path d="M13 3h4v14h-4M9 13l4-3-4-3M13 10H3"
                stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed()">Logout</span>
      </button>

    </div>
  </aside>

  <!-- ══ MAIN ══════════════════════════════════════════════════════════════ -->
  <main class="admin-main">

    <header class="topbar">
      <h2 class="topbar-title">{{ pageTitle() }}</h2>
      <div class="topbar-right">
        <div class="topbar-badge">
          <span class="status-dot"></span>
          {{ isSuperAdmin() ? 'Super Admin' : 'Admin' }} · {{ adminEmail() }}
        </div>
      </div>
    </header>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
