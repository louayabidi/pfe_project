<div class="auth-page">
  <div class="auth-card">

    <a routerLink="/home" class="auth-logo">
      <span class="logo-gami">Gami</span><span class="logo-fy">fy</span>
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your Gamify dashboard</p>

    <div class="auth-error" *ngIf="error()">
      <span>⚠️</span> {{ error() }}
    </div>

    <!-- Google OAuth2 Button -->
    <button type="button" class="btn-google" (click)="loginWithGoogle()">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="auth-form">

      <div class="field">
        <label for="email">Email</label>
        <input id="email" formControlName="email"
               type="email" placeholder="you@company.com"
               [class.invalid]="f['email'].touched && f['email'].invalid"/>
        <span class="field-error"
              *ngIf="f['email'].touched && f['email'].errors?.['email']">
          Enter a valid email
        </span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" formControlName="password"
                 [type]="showPass() ? 'text' : 'password'"
                 placeholder="Your password"
                 [class.invalid]="f['password'].touched && f['password'].invalid"/>
          <button type="button" class="toggle-pass"
                  (click)="showPass.set(!showPass())"
                  [attr.aria-label]="showPass() ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPass()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-error"
              *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required
        </span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading()">
        <span *ngIf="!loading()">
          Sign in
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span *ngIf="loading()" class="spinner"></span>
      </button>

    </form>

    <p class="auth-switch">
      No account yet?
      <a routerLink="/register">Create one free</a>
    </p>

  </div>
</div>
