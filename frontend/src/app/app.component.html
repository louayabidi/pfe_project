<ng-container *ngIf="showShell && !isDashboard; else noShell">
  <div class="app-container">
    <app-header></app-header>
    <main>
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </div>
</ng-container>

<ng-template #noShell>
  <router-outlet></router-outlet>
</ng-template>
