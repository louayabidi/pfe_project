spring.application.name=gamification-backend-test
server.port=8081

# Test Database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true

# JWT - Test defaults
jwt.secret=${JWT_SECRET:test-secret-jwt-key-for-testing}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth2 - Mock values for testing
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

# Frontend URL
app.frontend-url=http://localhost:4200
app.upload-dir=uploads/badges
app.base-url=http://localhost:8081

# Logging
logging.level.root=WARN
logging.level.com.gamification.backend=DEBUG