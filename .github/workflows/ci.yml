name: Gamify Platform CI

on:
  push:
    branches: [ analytics ]
  pull_request:
    branches: [ analytics ]

jobs:

  # ─── 1. SCAN DE SÉCURITÉ ─────────────────────────────────
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run Semgrep
        run: semgrep scan --config auto --error

  # ─── 2. BACKEND BUILD & TEST ─────────────────────────────
  backend-build:
    name: Backend Build & Test
    needs: security-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gamification
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and Test Backend
        working-directory: ./backend
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gamification
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin123

  # ─── 3. FRONTEND BUILD & UNIT TESTS ──────────────────────
  frontend-build:
    name: Frontend Build & Unit Tests
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Unit Tests with Coverage
        working-directory: ./frontend
        run: >
          npx ng test
          --no-watch
          --no-progress
          --browsers=ChromeHeadless
          --code-coverage
        env:
          CHROME_FLAGS: "--no-sandbox --disable-gpu"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

      - name: Build Angular App
        working-directory: ./frontend
        run: npm run build -- --configuration=production