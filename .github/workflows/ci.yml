name: Gamify Platform CI

on:
  push:
    branches: [ analytics ]
  pull_request:
    branches: [ analytics ]

jobs:


# ─── SECURITY SCAN (Semgrep) ─────────────────────────────
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep # Utilise l'image officielle pour plus de rapidité
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep with Auto Config
        run: semgrep scan --config auto --error # --error fait échouer le build s'il trouve une faille critique
        # Pas besoin de working-directory ici, Semgrep va trouver ./backend et ./frontend tout seul !


  # ─── BACKEND CHECK ───────────────────────────────────────
  backend-build:
    runs-on: ubuntu-latest

    # PostgreSQL service container (matches your docker-compose.yml)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gamification
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        working-directory: ./backend
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gamification
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin123

  # ─── FRONTEND CHECK ──────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular App
        working-directory: ./frontend
        run: npm run build -- --configuration=production