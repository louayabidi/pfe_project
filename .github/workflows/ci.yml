name: Gamify Platform CI

on:
  push:
    branches: [ analytics ]
  pull_request:
    branches: [ analytics ]

jobs:

  #Playwright tests

# 1. SCAN DE SÉCURITÉ (Rapide et indépendant)
  security-scan:
    runs-on: ubuntu-latest
    container: { image: returntocorp/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error

  # 2. TESTS FONCTIONNELS (Playwright)
  e2e-tests:
    needs: security-scan # On ne lance les tests que si la sécurité est OK
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gamification
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # Setup Java & Build Backend pour qu'il soit prêt à tourner
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build Backend
        run: mvn clean install -DskipTests
        working-directory: ./backend

      # Setup Node & Install Frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      # --- ÉTAPE CRUCIALE POUR PLAYWRIGHT ---
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./frontend

      - name: Run Backend & Frontend and Test
        run: |
          # 1. Lancer le backend en arrière-plan
          cd backend && mvn spring-boot:run & 
          # 2. Lancer le frontend en arrière-plan
          cd frontend && npm start & 
          # 3. Attendre que les serveurs soient prêts (ex: avec npx wait-on)
          npx wait-on http://localhost:4200 --timeout 60000
          # 4. Lancer les tests Playwright
          cd frontend && npx playwright test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gamification
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: pass

      # Sauvegarder le rapport (vidéos/screenshots) si un test échoue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30



# ─── SECURITY SCAN (Semgrep) ─────────────────────────────
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep # Utilise l'image officielle pour plus de rapidité
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep with Auto Config
        run: semgrep scan --config auto --error # --error fait échouer le build s'il trouve une faille critique
        # Pas besoin de working-directory ici, Semgrep va trouver ./backend et ./frontend tout seul !


  # ─── BACKEND CHECK ───────────────────────────────────────
  backend-build:
    runs-on: ubuntu-latest

    # PostgreSQL service container (matches your docker-compose.yml)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gamification
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        working-directory: ./backend
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gamification
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin123

  # ─── FRONTEND CHECK ──────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular App
        working-directory: ./frontend
        run: npm run build -- --configuration=production